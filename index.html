<!doctype html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Click Attack</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>


<body>


    <h1 id="title">Click Attack</h1>

    <p id="message" class="feedback">
        Enter your name and choose an attack value
    </p>

    <div class="card">
        <label for="playerName">PlayerName:</label>
        <input id="playerName" type="text">

        <label for="attackValue">Attack value</label>
        <input id="attackValue" type="number" min="1" max="10" value="1">
    </div>



    <p>Score: <span id="score">0</span></p>

    <button id="attackButton">Attack</button>
    <button id="resetButton">Reset</button>
    <button id="powerAttack">Power Attack</button>


</body>
</html>
